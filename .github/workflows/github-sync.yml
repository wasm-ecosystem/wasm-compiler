name: sync code to oss

on:
  push:
    branches:
      - main
      - master
      - develop
      - "release/*"
    tags:
      - "*"
  workflow_dispatch:

jobs:
  sync-to-github:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          git remote add github https://${{ secrets.OSS_GITHUB_NAME }}:${{ secrets.OSS_GITHUB_TOKEN }}@github.com/wasm-ecosystem/wasm-compiler.git

          # Push only the current branch/tag that triggered the workflow
          if [[ $GITHUB_REF == refs/heads/* ]]; then
            # It's a branch push
            BRANCH_NAME=${GITHUB_REF#refs/heads/}
            git push github "$BRANCH_NAME" -f
          elif [[ $GITHUB_REF == refs/tags/* ]]; then
            # It's a tag push - only push the specific tag that triggered this
            TAG_NAME=${GITHUB_REF#refs/tags/}
            git push github "$TAG_NAME"
          fi
